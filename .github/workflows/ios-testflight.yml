name: iOS TestFlight (Student)

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
    paths:
      - "ios/**"
      - "lib/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "TESTFLIGHT_SETUP_AR.md"
      - ".github/workflows/ios-testflight.yml"

jobs:
  build-and-upload:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: ios

      - name: Install CocoaPods
        working-directory: ios
        run: bundle exec pod install

      - name: Import signing certificate
        env:
          IOS_DISTRIBUTION_CER_BASE64: ${{ secrets.IOS_DISTRIBUTION_CER_BASE64 }}
          IOS_DISTRIBUTION_KEY_BASE64: ${{ secrets.IOS_DISTRIBUTION_KEY_BASE64 }}
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/dist.cer
          KEY_PATH=$RUNNER_TEMP/dist.key
          PEM_PATH=$RUNNER_TEMP/dist.pem
          P12_PATH=$RUNNER_TEMP/dist.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=temp_signing_keychain
          P12_PASSWORD=temp_p12_password

          if [[ -n "$IOS_DISTRIBUTION_CER_BASE64" && -n "$IOS_DISTRIBUTION_KEY_BASE64" ]]; then
            echo "$IOS_DISTRIBUTION_CER_BASE64" | base64 --decode > "$CERT_PATH"
            echo "$IOS_DISTRIBUTION_KEY_BASE64" | base64 --decode > "$KEY_PATH"
            openssl x509 -inform DER -in "$CERT_PATH" -out "$PEM_PATH"
            openssl pkcs12 -export -inkey "$KEY_PATH" -in "$PEM_PATH" -out "$P12_PATH" -password pass:"$P12_PASSWORD"
          elif [[ -n "$IOS_CERTIFICATE_P12_BASE64" && -n "$IOS_CERTIFICATE_PASSWORD" ]]; then
            P12_PASSWORD="$IOS_CERTIFICATE_PASSWORD"
            echo "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$P12_PATH"
          else
            echo "Missing signing secrets. Provide either IOS_DISTRIBUTION_CER_BASE64 + IOS_DISTRIBUTION_KEY_BASE64 OR IOS_CERTIFICATE_P12_BASE64 + IOS_CERTIFICATE_PASSWORD"
            exit 1
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -s "$KEYCHAIN_PATH"
          security import "$P12_PATH" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -A -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          PP_DIR=~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          PROFILE_PLIST=$RUNNER_TEMP/profile.plist

          mkdir -p "$PP_DIR"
          echo "$IOS_MOBILEPROVISION_BASE64" | base64 --decode > "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$PROFILE_PLIST")

          cp "$PROFILE_PATH" "$PP_DIR/$PROFILE_UUID.mobileprovision"

          echo "IOS_PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV
          echo "IOS_PROFILE_NAME=$PROFILE_NAME" >> $GITHUB_ENV
          echo "Installed provisioning profile: $PROFILE_NAME ($PROFILE_UUID)"

      - name: Build and Upload TestFlight
        working-directory: ios
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
        run: bundle exec fastlane testflight
