name: iOS TestFlight (Student)

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
    paths:
      - "ios/**"
      - "lib/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "TESTFLIGHT_SETUP_AR.md"
      - ".github/workflows/ios-testflight.yml"

jobs:
  build-and-upload:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: ios

      - name: Install CocoaPods
        working-directory: ios
        run: bundle exec pod install

      - name: Import signing certificate
        env:
          IOS_DISTRIBUTION_CER_BASE64: ${{ secrets.IOS_DISTRIBUTION_CER_BASE64 }}
          IOS_DISTRIBUTION_KEY_BASE64: ${{ secrets.IOS_DISTRIBUTION_KEY_BASE64 }}
        run: |
          CERT_PATH=$RUNNER_TEMP/dist.cer
          KEY_PATH=$RUNNER_TEMP/dist.key
          PEM_PATH=$RUNNER_TEMP/dist.pem
          P12_PATH=$RUNNER_TEMP/dist.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=temp_signing_keychain
          P12_PASSWORD=temp_p12_password

          echo "$IOS_DISTRIBUTION_CER_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$IOS_DISTRIBUTION_KEY_BASE64" | base64 --decode > "$KEY_PATH"

          openssl x509 -inform DER -in "$CERT_PATH" -out "$PEM_PATH"
          openssl pkcs12 -export -inkey "$KEY_PATH" -in "$PEM_PATH" -out "$P12_PATH" -password pass:"$P12_PASSWORD"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -s "$KEYCHAIN_PATH"
          security import "$P12_PATH" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -A -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_MOBILEPROVISION_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/stagelink.mobileprovision

      - name: Build and Upload TestFlight
        working-directory: ios
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
        run: bundle exec fastlane testflight
